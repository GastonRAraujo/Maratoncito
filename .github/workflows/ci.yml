name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test
        run: python -m pytest -q backend/tests
      - name: Validate OpenAPI export
        run: python scripts/export_openapi.py --check

  docker:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Build container
        run: docker build -t maratoncito:test .
