services:
  maratoncito:
    build: .
    environment:
      MARATONCITO_DATABASE_URL: sqlite:////data/maratoncito.db
    ports:
      - "${MARATONCITO_BIND_HOST:-127.0.0.1}:${MARATONCITO_PORT:-8000}:8000"
    volumes:
      - maratoncito-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  maratoncito-data:
