services:
  maratoncito:
    build: .
    environment:
      MARATONCITO_DATABASE_URL: sqlite:////data/maratoncito.db
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-http://host.docker.internal:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MARATONCITO_BIND_HOST:-127.0.0.1}:${MARATONCITO_PORT:-8000}:8000"
    volumes:
      - maratoncito-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  maratoncito-data:
