<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17212c" />
    <title>Maratoncito</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Self-hosted media manager</p>
        <h1>Maratoncito</h1>
        <p>One place to discover, request, select, and manage your movies and shows.</p>
      </header>
      <section class="panel" aria-labelledby="connection-heading">
        <div class="panel-heading">
          <h2 id="connection-heading">System status</h2>
          <span id="connection" class="status">Connecting…</span>
        </div>
        <p id="version" class="secondary">Checking the API…</p>
      </section>
      <section class="panel" aria-labelledby="modules-heading">
        <h2 id="modules-heading">Planned modules</h2>
        <div id="modules" class="modules" aria-live="polite">
          <p class="secondary">Loading available capabilities…</p>
        </div>
      </section>
      <footer>Foundation preview · No media actions are available yet</footer>
    </main>
  </body>
</html>
